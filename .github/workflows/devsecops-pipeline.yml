name: DevSecOps Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Ejecutar analisis SAST
        run: |
          semgrep scan \
            --config p/security-audit \
            --json \
            --output semgrep-results.json \
            .

      - name: Verificar reporte JSON
        run: |
          python -c "import json; d=json.load(open('semgrep-results.json')); print('Hallazgos SAST:', len(d.get('results', [])))"

      - name: Verificar politica SAST
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep-results.json") as f:
              report = json.load(f)

          if report.get("errors"):
              print("ERROR: El analisis SAST contiene errores.")
              sys.exit(1)

          findings = report.get("results", [])
          blocking = [
              r for r in findings
              if r.get("extra", {}).get("severity", "").upper()
              in ("ERROR", "HIGH", "CRITICAL")
          ]

          print("Hallazgos totales:", len(findings))
          print("Hallazgos bloqueantes:", len(blocking))

          for r in blocking:
              print(r["check_id"], r["path"])

          if blocking:
              print("QUALITY GATE SAST: FAILED")
              sys.exit(1)

          print("QUALITY GATE SAST: PASSED")
          PY
      - name: Publicar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-report
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 30

  sbom-cyclonedx:
    name: SBOM - Syft CycloneDX
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Generar SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Verificar componentes del SBOM
        run: |
          python3 - <<'PY'
          import json
          with open("sbom.cyclonedx.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("bomFormat") == "CycloneDX"
          components = data.get("components", [])
          print("Formato:", data["bomFormat"])
          print("Componentes encontrados:", len(components))
          assert len(components) > 0, "SBOM sin componentes"
          PY

      - name: Publicar SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Analizar dependencias
        id: dependency_scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: NodeGoat
          path: .
          format: HTML
          out: reports
          args: >
            --enableExperimental
            --failOnCVSS 7

      - name: Publicar reporte SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Comprobar ejecucion SCA
        if: always()
        run: |
          echo "Estado del escaneo: ${{ steps.dependency_scan.outcome }}"
          if [ -f reports/dependency-check-report.html ]; then
            echo "Reporte HTML generado correctamente"
          else
            echo "::warning::No se genero el reporte HTML"
          fi

